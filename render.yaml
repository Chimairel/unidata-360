services:
  - type: web
    name: karto-edm-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: EDM_DEMO_STAFF_PASSWORDS
        value: "true"
      - key: EDM_PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: karto-edm-db
          property: connectionString
      - key: EDM_STAFF_OPS_MANAGER_PASSWORD
        generateValue: true
      - key: EDM_STAFF_MARKETING_CRM_PASSWORD
        generateValue: true
      - key: EDM_STAFF_BRANCH_MANAGER_PASSWORD
        generateValue: true
      - key: EDM_STAFF_COMPLIANCE_AUDITOR_PASSWORD
        generateValue: true

databases:
  - name: karto-edm-db
    plan: free
    region: singapore
    ipAllowList: []
